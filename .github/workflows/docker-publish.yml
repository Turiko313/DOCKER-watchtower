name: Build and Push Watchtower Dashboard

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r dashboard/requirements.txt

      - name: Run unit and security tests
        env:
          WATCHTOWER_HTTP_API_TOKEN: test-watchtower-token-at-least-32-chars
          DASHBOARD_USERNAME: test-user
          DASHBOARD_PASSWORD: test-password
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: python -m unittest discover -s dashboard/tests -v

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip -r dashboard/requirements.txt

      - name: Validate Compose configuration
        env:
          WATCHTOWER_API_TOKEN: test-watchtower-token-at-least-32-chars
          DASHBOARD_USERNAME: test-user
          DASHBOARD_PASSWORD: test-password
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: docker compose config --quiet

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/turiko313/watchtower-dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
