name: Build and Push Watchtower Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r dashboard/requirements.txt

      - name: Run unit and security tests
        env:
          WATCHTOWER_HTTP_API_TOKEN: test-watchtower-token-at-least-32-chars
          DASHBOARD_USERNAME: test-user
          DASHBOARD_PASSWORD: test-password
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: python -m unittest discover -s dashboard/tests -v

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip -r dashboard/requirements.txt

      - name: Validate Compose configuration
        env:
          WATCHTOWER_API_TOKEN: test-watchtower-token-at-least-32-chars
          DASHBOARD_USERNAME: test-user
          DASHBOARD_PASSWORD: test-password
          SECRET_KEY: test-secret-key-with-at-least-32-characters
        run: docker compose config --quiet

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/turiko313/watchtower-dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
